<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — ShopSphere</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/index.html" class="logo">Shop<span class="dot">•</span>Sphere</a>
    <div class="header-actions" style="margin-left:auto;">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode"></button>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card" id="authCard">
    <h1>Reset your password</h1>
    <p class="sub">Enter your account email and we'll send you a reset link.</p>

    <div id="formError" class="field-error hidden" style="margin-bottom:14px;"></div>
    <div id="formSuccess" class="hidden" style="background:var(--color-success-soft); color:var(--color-success); padding:12px 14px; border-radius:var(--radius-sm); font-size:13.5px; margin-bottom:16px;"></div>

    <form id="forgotForm">
      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
    </form>

    <div class="auth-switch">Remembered it? <a href="/login.html">Back to log in</a></div>
  </div>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/nav.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('formError');
  const okEl = document.getElementById('formSuccess');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Sending...';

  try {
    const res = await api.post('/auth/forgot-password', { email: document.getElementById('email').value.trim() }, { auth: false });
    okEl.textContent = res.message;
    okEl.classList.remove('hidden');
    document.getElementById('forgotForm').reset();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
});
</script>
</body>
</html>
