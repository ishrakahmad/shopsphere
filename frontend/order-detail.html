<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Details — ShopSphere</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .invoice-box { max-width: 780px; margin: 0 auto; }
  .invoice-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 26px; flex-wrap: wrap; gap: 14px; }
  .addr-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
  .invoice-table th, .invoice-table td { padding: 10px 8px; }
  @media print {
    .site-header, .no-print { display: none !important; }
    body { background: #fff; }
  }
  @media (max-width: 700px) { .addr-cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="site-header no-print">
  <div class="container header-inner">
    <a href="/index.html" class="logo">Shop<span class="dot">•</span>Sphere</a>
    <nav class="main-nav"><a href="/index.html">Home</a><a href="/orders.html">My Orders</a></nav>
    <div class="header-actions" style="margin-left:auto;">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode"></button>
      <div id="userMenuArea" class="flex items-center gap-8"></div>
    </div>
  </div>
</header>

<div class="container invoice-box" style="padding-top:28px; padding-bottom:60px;">
  <div id="orderRoot"><div class="loader"></div></div>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/nav.js"></script>
<script>
function resolveImg(path) {
  if (!path) return '';
  if (path.startsWith('http')) return path;
  return API_BASE.replace('/api/v1', '') + path;
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!requireAuth()) return;
  const id = qs('id');
  const root = document.getElementById('orderRoot');
  if (!id) { root.innerHTML = `<div class="empty-state"><h3>No order specified</h3></div>`; return; }

  try {
    const o = await api.get(`/orders/${id}`);
    render(o);
  } catch (err) {
    root.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Could not load order</h3><p>${escapeHtml(err.message)}</p></div>`;
  }
});

function render(o) {
  const root = document.getElementById('orderRoot');
  const canCancel = ['PENDING', 'PROCESSING'].includes(o.status);

  root.innerHTML = `
    <div class="invoice-head">
      <div>
        <div class="breadcrumb no-print"><a href="/orders.html">My Orders</a> / ${escapeHtml(o.orderNumber)}</div>
        <h1 style="font-size:1.6rem; margin:0;">Order ${escapeHtml(o.orderNumber)}</h1>
        <p class="text-sm text-faint" style="margin:4px 0 0;">Placed on ${formatDate(o.createdAt)}</p>
      </div>
      <div class="flex flex-col gap-8" style="align-items:flex-end;">
        <span class="status-pill status-${o.status}">${o.status}</span>
        <span class="status-pill status-${o.payment?.status || 'PENDING'}">Payment: ${o.payment?.status || 'PENDING'}</span>
      </div>
    </div>

    <div class="panel">
      <div class="addr-cols">
        <div>
          <h4 style="font-size:12px; text-transform:uppercase; color:var(--color-ink-faint); margin-bottom:8px;">Shipping address</h4>
          <p style="margin:0; font-size:13.5px;">
            <strong>${escapeHtml(o.shippingAddress.fullName)}</strong><br>
            ${escapeHtml(o.shippingAddress.addressLine)}<br>
            ${escapeHtml(o.shippingAddress.city)}${o.shippingAddress.state ? ', ' + escapeHtml(o.shippingAddress.state) : ''} ${escapeHtml(o.shippingAddress.postalCode)}<br>
            ${escapeHtml(o.shippingAddress.country)}<br>
            📞 ${escapeHtml(o.shippingAddress.phone)}
          </p>
        </div>
        <div>
          <h4 style="font-size:12px; text-transform:uppercase; color:var(--color-ink-faint); margin-bottom:8px;">Payment method</h4>
          <p style="margin:0; font-size:13.5px;">${o.paymentMethod === 'COD' ? '💵 Cash on Delivery' : o.paymentMethod}</p>
        </div>
      </div>

      <div class="table-wrap">
        <table class="invoice-table">
          <thead><tr><th>Item</th><th>Price</th><th>Qty</th><th style="text-align:right;">Subtotal</th></tr></thead>
          <tbody>
            ${o.items.map((i) => `
              <tr>
                <td class="flex items-center gap-8">
                  <div class="order-thumb" style="width:40px;height:40px;border-radius:6px;background:var(--color-surface-sunken);display:flex;align-items:center;justify-content:center;overflow:hidden;">${i.image ? `<img src="${resolveImg(i.image)}" style="width:100%;height:100%;object-fit:cover;">` : '📦'}</div>
                  <span>${escapeHtml(i.name)}</span>
                </td>
                <td class="price">${formatMoney(i.price)}</td>
                <td>${i.quantity}</td>
                <td style="text-align:right;" class="price">${formatMoney(i.price * i.quantity)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <div style="max-width:280px; margin-left:auto; margin-top:16px;">
        <div class="summary-row"><span>Subtotal</span><span class="price">${formatMoney(o.subtotal)}</span></div>
        <div class="summary-row"><span>Discount</span><span class="price">−${formatMoney(o.discount)}</span></div>
        <div class="summary-row"><span>Shipping</span><span class="price">${Number(o.shippingFee) === 0 ? 'FREE' : formatMoney(o.shippingFee)}</span></div>
        <div class="summary-row total"><span>Total</span><span class="price">${formatMoney(o.total)}</span></div>
      </div>
    </div>

    <div class="flex gap-12 no-print" style="margin-top:20px;">
      <button class="btn btn-outline" onclick="window.print()">🖨️ Print invoice</button>
      ${canCancel ? `<button class="btn btn-danger" id="cancelOrderBtn">Cancel order</button>` : ''}
      <a href="/orders.html" class="btn btn-ghost">Back to orders</a>
    </div>
  `;

  const cancelBtn = document.getElementById('cancelOrderBtn');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', async () => {
      if (!confirm('Cancel this order? This cannot be undone.')) return;
      try {
        const updated = await api.patch(`/orders/${o.id}/cancel`);
        toast('Order cancelled', 'success');
        render({ ...o, ...updated });
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  }
}
</script>
</body>
</html>
