<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — ShopSphere</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .order-card { padding: 18px; margin-bottom: 14px; }
  .order-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .order-items-preview { display: flex; gap: 8px; margin: 10px 0; }
  .order-thumb { width: 50px; height: 50px; border-radius: 6px; background: var(--color-surface-sunken); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; overflow: hidden; }
  .order-thumb img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/index.html" class="logo">Shop<span class="dot">•</span>Sphere</a>
    <nav class="main-nav"><a href="/index.html">Home</a><a href="/shop.html">Shop</a></nav>
    <div class="header-actions" style="margin-left:auto;">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode"></button>
      <div id="userMenuArea" class="flex items-center gap-8"></div>
    </div>
  </div>
</header>

<div class="container" style="padding-top:28px; padding-bottom:60px; max-width:820px;">
  <h1 style="font-size:1.8rem;">My Orders</h1>
  <div id="ordersRoot" style="margin-top:20px;"><div class="loader"></div></div>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!requireAuth()) return;
  const root = document.getElementById('ordersRoot');
  try {
    const res = await api.get('/orders/my?limit=20');
    if (res.data.length === 0) {
      root.innerHTML = `<div class="empty-state"><div class="icon">📦</div><h3>No orders yet</h3><p>Your placed orders will show up here.</p><a href="/shop.html" class="btn btn-primary">Start shopping</a></div>`;
      return;
    }
    root.innerHTML = res.data.map(orderCardHtml).join('');
  } catch (err) {
    root.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Could not load orders</h3><p>${escapeHtml(err.message)}</p></div>`;
  }
});

function orderCardHtml(o) {
  return `
    <div class="panel order-card">
      <div class="order-card-head">
        <div>
          <div style="font-weight:700; font-family:var(--font-mono); font-size:14px;">${escapeHtml(o.orderNumber)}</div>
          <div class="text-sm text-faint">${formatDate(o.createdAt)}</div>
        </div>
        <span class="status-pill status-${o.status}">${o.status}</span>
      </div>
      <div class="order-items-preview">
        ${o.items.slice(0, 5).map((i) => `<div class="order-thumb">${i.image ? `<img src="${resolveImg(i.image)}">` : '📦'}</div>`).join('')}
        ${o.items.length > 5 ? `<div class="order-thumb text-sm">+${o.items.length - 5}</div>` : ''}
      </div>
      <div class="flex justify-between items-center">
        <span class="price price-now">${formatMoney(o.total)}</span>
        <a href="/order-detail.html?id=${o.id}" class="btn btn-outline btn-sm">View details</a>
      </div>
    </div>
  `;
}

function resolveImg(path) {
  if (!path) return '';
  if (path.startsWith('http')) return path;
  return API_BASE.replace('/api/v1', '') + path;
}
</script>
</body>
</html>
