<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product — ShopSphere</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .pd-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; }
  .pd-gallery-main { aspect-ratio: 1/1; background: var(--color-surface-sunken); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 6rem; border: 1px solid var(--color-border); }
  .pd-gallery-main img { width: 100%; height: 100%; object-fit: cover; }
  .pd-thumbs { display: flex; gap: 10px; margin-top: 12px; }
  .pd-thumb { width: 68px; height: 68px; border-radius: var(--radius-sm); border: 2px solid var(--color-border); overflow: hidden; cursor: pointer; background: var(--color-surface-sunken); display:flex; align-items:center; justify-content:center; }
  .pd-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .pd-thumb.active { border-color: var(--color-primary); }
  .pd-actions { display: flex; gap: 12px; margin: 22px 0; }
  .pd-meta-row { display: flex; gap: 18px; font-size: 13px; color: var(--color-ink-soft); margin: 14px 0; flex-wrap: wrap; }
  .review-item { padding: 16px 0; border-bottom: 1px solid var(--color-border); }
  .review-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .avatar-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--color-primary-soft); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); margin: 40px 0 24px; }
  .tab-btn { padding: 12px 18px; font-size: 14px; font-weight: 600; color: var(--color-ink-faint); border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; }
  .tab-btn.active { color: var(--color-ink); border-color: var(--color-accent); }
  @media (max-width: 800px) { .pd-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/index.html" class="logo">Shop<span class="dot">•</span>Sphere</a>
    <nav class="main-nav">
      <a href="/index.html">Home</a>
      <a href="/shop.html">Shop</a>
      <a href="/shop.html?featured=true">Featured</a>
      <a href="/shop.html?flashSale=true">Flash Sale</a>
    </nav>
    <form id="searchForm" class="header-search">
      <input id="searchInput" type="text" placeholder="Search products...">
      <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
    </form>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode"></button>
      <a href="/wishlist.html" class="icon-btn" aria-label="Wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span id="wishlistCount" class="badge-count hidden">0</span>
      </a>
      <a href="/cart.html" class="icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span id="cartCount" class="badge-count hidden">0</span>
      </a>
      <div id="userMenuArea" class="flex items-center gap-8"></div>
      <button id="mobileNavToggle" class="icon-btn mobile-nav-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="container" style="padding-top:24px;" id="productContainer">
  <div class="loader"></div>
</div>

<footer class="site-footer" style="margin-top:40px;">
  <div class="container footer-bottom">
    <span>© 2026 ShopSphere. All rights reserved.</span>
  </div>
</footer>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/nav.js"></script>
<script src="/assets/js/product-card.js"></script>
<script src="/assets/js/product.js"></script>
</body>
</html>
