<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — ShopSphere</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/index.html" class="logo">Shop<span class="dot">•</span>Sphere</a>
    <div class="header-actions" style="margin-left:auto;">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode"></button>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>

    <div id="formError" class="field-error hidden" style="margin-bottom:14px;"></div>
    <div id="noTokenMsg" class="hidden" style="background:var(--color-accent-soft); color:var(--color-accent); padding:12px 14px; border-radius:var(--radius-sm); font-size:13.5px; margin-bottom:16px;">
      This link is missing a reset token. Please request a new one from the <a href="/forgot-password.html" style="color:inherit; text-decoration:underline;">forgot password page</a>.
    </div>

    <form id="resetForm">
      <div class="field">
        <label>New password</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Reset password</button>
    </form>

    <div class="auth-switch"><a href="/login.html">Back to log in</a></div>
  </div>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/nav.js"></script>
<script>
const token = qs('token');
if (!token) {
  document.getElementById('noTokenMsg').classList.remove('hidden');
  document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('formError');
  errEl.classList.add('hidden');

  const pass = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  if (pass !== confirm) {
    errEl.textContent = 'Passwords do not match.';
    errEl.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Resetting...';

  try {
    const res = await api.post('/auth/reset-password', { token, newPassword: pass }, { auth: false });
    toast(res.message, 'success');
    setTimeout(() => window.location.href = '/login.html', 1200);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Reset password';
  }
});
</script>
</body>
</html>
