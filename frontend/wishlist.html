<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — ShopSphere</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/index.html" class="logo">Shop<span class="dot">•</span>Sphere</a>
    <nav class="main-nav">
      <a href="/index.html">Home</a>
      <a href="/shop.html">Shop</a>
    </nav>
    <form id="searchForm" class="header-search">
      <input id="searchInput" type="text" placeholder="Search products...">
      <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
    </form>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode"></button>
      <a href="/wishlist.html" class="icon-btn" aria-label="Wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span id="wishlistCount" class="badge-count hidden">0</span>
      </a>
      <a href="/cart.html" class="icon-btn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span id="cartCount" class="badge-count hidden">0</span>
      </a>
      <div id="userMenuArea" class="flex items-center gap-8"></div>
    </div>
  </div>
</header>

<div class="container" style="padding-top:28px; padding-bottom:60px;">
  <h1 style="font-size:1.8rem;">Your Wishlist</h1>
  <div id="wishlistRoot" class="product-grid" style="margin-top:20px;"><div class="loader"></div></div>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/nav.js"></script>
<script src="/assets/js/product-card.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!requireAuth()) return;
  const root = document.getElementById('wishlistRoot');
  try {
    const list = await api.get('/wishlist');
    if (list.length === 0) {
      root.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">❤️</div><h3>Your wishlist is empty</h3><p>Save products you love to find them here later.</p><a href="/shop.html" class="btn btn-primary">Browse products</a></div>`;
      return;
    }
    const products = list.map((w) => w.product);
    renderProductGrid(root, products);
    wireProductGridEvents(root);
    root.querySelectorAll('[data-action="wishlist"]').forEach((btn) => btn.classList.add('active'));

    // Re-render list on removal so it disappears immediately
    root.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action="wishlist"]');
      if (btn && btn.classList.contains('active') === false) {
        setTimeout(() => btn.closest('.product-card')?.remove(), 200);
      }
    });
  } catch (err) {
    root.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">⚠️</div><h3>Could not load wishlist</h3><p>${escapeHtml(err.message)}</p></div>`;
  }
});
</script>
</body>
</html>
